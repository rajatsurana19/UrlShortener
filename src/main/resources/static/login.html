<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UrlShortener</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="/" class="logo auth-logo">
            <span class="logo-u">U</span><span class="logo-s">S</span>
        </a>
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Login to manage your links and see insights.</p>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="auth-btn">Login</button>
            </form>
            <p class="auth-footer">Don't have an account? <a href="/register">Sign up</a></p>
        </div>
    </div>
</body>
</html>
