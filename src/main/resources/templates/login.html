<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | US</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="/" class="logo auth-logo">
            <span class="logo-u">U</span><span class="logo-s">S</span>
        </a>
        <div class="auth-card">
            <h2>Welcome back</h2>
            <p>Enter your details to manage your links.</p>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-btn">Sign In</button>
            </form>
            <p class="auth-footer">New here? <a href="/register">Create an account</a></p>
        </div>
    </div>
</body>
</html>
